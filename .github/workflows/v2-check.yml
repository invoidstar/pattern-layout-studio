name: V2 Workspace Check
on:
  push:
    branches: [feature/v2-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tests/v2-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-workspace-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
