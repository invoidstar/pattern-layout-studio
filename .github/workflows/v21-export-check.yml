name: V2.1 Export Verification
on:
  push:
    branches: [feature/v2-export-background-favicon]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tests/export-background.mjs
      - run: node tests/v2-smoke.mjs
